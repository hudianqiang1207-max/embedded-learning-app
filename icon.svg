<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 嵌入式学习 · 芯片图标 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A6E"/>
      <stop offset="100%" stop-color="#12203A"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A9CFF"/>
      <stop offset="100%" stop-color="#3B6FE0"/>
    </linearGradient>
  </defs>
  <!-- 底 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- 引脚 -->
  <g fill="#FFC145">
    <rect x="30" y="12" width="6" height="18" rx="3"/>
    <rect x="61" y="12" width="6" height="18" rx="3"/>
    <rect x="92" y="12" width="6" height="18" rx="3"/>
    <rect x="30" y="98" width="6" height="18" rx="3"/>
    <rect x="61" y="98" width="6" height="18" rx="3"/>
    <rect x="92" y="98" width="6" height="18" rx="3"/>
    <rect x="12" y="30" width="18" height="6" rx="3"/>
    <rect x="12" y="61" width="18" height="6" rx="3"/>
    <rect x="12" y="92" width="18" height="6" rx="3"/>
    <rect x="98" y="30" width="18" height="6" rx="3"/>
    <rect x="98" y="61" width="18" height="6" rx="3"/>
    <rect x="98" y="92" width="18" height="6" rx="3"/>
  </g>
  <!-- 芯片 -->
  <rect x="32" y="32" width="64" height="64" rx="10" fill="url(#chip)"/>
  <rect x="42" y="42" width="44" height="44" rx="6" fill="#1A2B45"/>
  <!-- 字母 E -->
  <text x="64" y="74" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="30" font-weight="bold" fill="#FFFFFF">E</text>
  <!-- 电路点缀 -->
  <g stroke="#7AB0FF" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M20 110h12M96 110h12"/>
  </g>
</svg>
