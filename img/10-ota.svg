<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="100%" height="100%" fill="#0f1724"/><rect x="80" y="160" width="220" height="120" rx="12" fill="#22407a" stroke="#4b8dff" stroke-width="2"/><text x="190" y="210" fill="#fff" font-size="20" font-family="sans-serif" text-anchor="middle">A 分区</text><text x="190" y="245" fill="#9fc0ff" font-size="14" font-family="sans-serif" text-anchor="middle">当前固件</text><rect x="500" y="160" width="220" height="120" rx="12" fill="#2a2450" stroke="#7b5cff" stroke-width="2"/><text x="610" y="210" fill="#fff" font-size="20" font-family="sans-serif" text-anchor="middle">B 分区</text><text x="610" y="245" fill="#c4b5ff" font-size="14" font-family="sans-serif" text-anchor="middle">新固件</text><path d="M300 220 H500" stroke="#35d08a" stroke-width="4"/><text x="400" y="205" fill="#35d08a" font-size="16" font-family="sans-serif" text-anchor="middle">下载校验后切换</text><text x="400" y="80" fill="#b9d0ff" font-size="22" font-family="sans-serif" text-anchor="middle">A/B 升级：失败可回滚，不怕变砖</text><text x="400" y="360" fill="#7f94ad" font-size="18" font-family="sans-serif" text-anchor="middle">校验 → 写入 → 试运行 → 自动回滚</text><text x="400" y="410" fill="#ffb020" font-size="18" font-family="sans-serif" text-anchor="middle">回滚本身也要测！</text></svg>