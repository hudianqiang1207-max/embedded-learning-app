<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="100%" height="100%" fill="#0f1724"/><text x="400" y="70" fill="#b9d0ff" font-size="22" font-family="sans-serif" text-anchor="middle">小端 vs 大端</text><rect x="100" y="180" width="260" height="120" rx="10" fill="#22407a"/><text x="230" y="230" fill="#fff" font-size="16" font-family="sans-serif" text-anchor="middle">小端：低字节在低地址</text><text x="230" y="270" fill="#b9d0ff" font-size="14" font-family="sans-serif" text-anchor="middle">常见 ARM/x86</text><rect x="440" y="180" width="260" height="120" rx="10" fill="#2a2450" stroke="#7b5cff"/><text x="570" y="230" fill="#fff" font-size="16" font-family="sans-serif" text-anchor="middle">大端：高字节在低地址</text><text x="570" y="270" fill="#c4b5ff" font-size="14" font-family="sans-serif" text-anchor="middle">网络字节序</text><text x="400" y="380" fill="#b9d0ff" font-size="18" font-family="sans-serif" text-anchor="middle">跨机协议要约定并转换 htons/htonl</text></svg>