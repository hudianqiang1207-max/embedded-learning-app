<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="100%" height="100%" fill="#0f1724"/><rect x="80" y="160" width="180" height="120" rx="12" fill="#22407a" stroke="#4b8dff" stroke-width="2"/><text x="170" y="210" fill="#fff" font-size="24" font-family="sans-serif" text-anchor="middle">CPU</text><text x="170" y="250" fill="#9fc0ff" font-size="12" font-family="sans-serif" text-anchor="middle">取指译码执行</text><rect x="360" y="80" width="180" height="90" rx="12" fill="#2a2450" stroke="#4b8dff" stroke-width="2"/><text x="450" y="130" fill="#fff" font-size="16" font-family="sans-serif" text-anchor="middle">寄存器/缓存</text><rect x="360" y="220" width="180" height="90" rx="12" fill="#2a2450" stroke="#4b8dff" stroke-width="2"/><text x="450" y="270" fill="#fff" font-size="20" font-family="sans-serif" text-anchor="middle">RAM</text><rect x="360" y="350" width="180" height="90" rx="12" fill="#2a2450" stroke="#4b8dff" stroke-width="2"/><text x="450" y="400" fill="#fff" font-size="16" font-family="sans-serif" text-anchor="middle">Flash/磁盘</text><path d="M260 200 H360 M260 220 H360 M260 260 H360" stroke="#7aa8ff" stroke-width="3"/><text x="400" y="50" fill="#b9d0ff" font-size="22" font-family="sans-serif" text-anchor="middle">存储层次：越靠近 CPU 越快越贵</text></svg>