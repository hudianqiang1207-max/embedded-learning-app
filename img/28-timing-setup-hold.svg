<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="100%" height="100%" fill="#0f1724"/><text x="400" y="80" fill="#b9d0ff" font-size="22" font-family="sans-serif" text-anchor="middle">建立时间 / 保持时间</text><path d="M100 300 H700" stroke="#2c4263" stroke-width="2"/><path d="M300 180 V320" stroke="#7aa8ff" stroke-width="3"/><text x="300" y="160" fill="#7aa8ff" font-size="14" font-family="sans-serif" text-anchor="middle">时钟边沿</text><rect x="140" y="250" width="140" height="50" fill="#2a2450" stroke="#7b5cff"/><text x="210" y="280" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">数据稳定</text><text x="210" y="230" fill="#35d08a" font-size="14" font-family="sans-serif" text-anchor="middle">setup</text><text x="380" y="230" fill="#ffb020" font-size="14" font-family="sans-serif" text-anchor="middle">hold</text><text x="400" y="400" fill="#7f94ad" font-size="16" font-family="sans-serif" text-anchor="middle">数据必须在边沿前后保持稳定，否则采样错</text></svg>