<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="100%" height="100%" fill="#0f1724"/><text x="400" y="70" fill="#b9d0ff" font-size="22" font-family="sans-serif" text-anchor="middle">电阻色环读数（示例）</text><rect x="200" y="160" width="70" height="120" fill="#8B4513"/><rect x="300" y="160" width="70" height="120" fill="#111"/><rect x="400" y="160" width="70" height="120" fill="#c0392b"/><rect x="500" y="160" width="70" height="120" fill="#d4af37"/><rect x="160" y="180" width="480" height="80" rx="20" fill="#e8e0d0" stroke="#aaa"/><rect x="220" y="185" width="50" height="70" fill="#8B4513"/><rect x="320" y="185" width="50" height="70" fill="#111"/><rect x="420" y="185" width="50" height="70" fill="#c0392b"/><rect x="520" y="185" width="50" height="70" fill="#d4af37"/><text x="400" y="340" fill="#b9d0ff" font-size="18" font-family="sans-serif" text-anchor="middle">棕黑红金 = 1 0 x100 ±5% = 1kΩ</text><text x="400" y="400" fill="#7f94ad" font-size="16" font-family="sans-serif" text-anchor="middle">新人先会读色环，再谈精确计算</text></svg>