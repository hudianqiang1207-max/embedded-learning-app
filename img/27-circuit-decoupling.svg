<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="100%" height="100%" fill="#0f1724"/><text x="400" y="80" fill="#b9d0ff" font-size="22" font-family="sans-serif" text-anchor="middle">去耦电容</text><rect x="250" y="160" width="180" height="100" rx="10" fill="#22407a" stroke="#4b8dff"/><text x="340" y="215" fill="#fff" font-size="18" font-family="sans-serif" text-anchor="middle">芯片</text><path d="M250 190 H180" stroke="#ffb020" stroke-width="3"/><path d="M180 150 V230" stroke="#ffb020" stroke-width="4"/><path d="M160 150 H200 M160 160 H200" stroke="#ffb020" stroke-width="3"/><text x="120" y="190" fill="#ffb020" font-size="14" font-family="sans-serif" text-anchor="middle">100nF</text><text x="400" y="360" fill="#b9d0ff" font-size="18" font-family="sans-serif" text-anchor="middle">电容要紧贴电源脚，回路尽量小</text><text x="400" y="420" fill="#7f94ad" font-size="16" font-family="sans-serif" text-anchor="middle">放远了基本失效，表现为通信偶发错误</text></svg>