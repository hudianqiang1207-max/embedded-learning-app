<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="100%" height="100%" fill="#0f1724"/><text x="400" y="70" fill="#b9d0ff" font-size="22" font-family="sans-serif" text-anchor="middle">排障五步</text><circle cx="130" cy="220" r="40" fill="#22407a" stroke="#4b8dff"/><text x="130" y="225" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">复现</text><circle cx="270" cy="220" r="40" fill="#22407a" stroke="#4b8dff"/><text x="270" y="225" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">证据</text><circle cx="410" cy="220" r="40" fill="#22407a" stroke="#4b8dff"/><text x="410" y="225" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">假设</text><circle cx="550" cy="220" r="40" fill="#22407a" stroke="#4b8dff"/><text x="550" y="225" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">验证</text><circle cx="690" cy="220" r="40" fill="#35d08a" stroke="#4b8dff"/><text x="690" y="225" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">根因</text><text x="400" y="340" fill="#b9d0ff" font-size="18" font-family="sans-serif" text-anchor="middle">一次只改一处，改完要验证</text><text x="400" y="400" fill="#7f94ad" font-size="16" font-family="sans-serif" text-anchor="middle">记下证据：日志、波形、电压、计数</text></svg>